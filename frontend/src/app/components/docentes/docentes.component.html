<app-navbar></app-navbar>

<div class="page-container">
  
  <div *ngIf="mostrarFormulario" class="form-container">
    <h3 class="form-title">
      {{ editando ? 'Editar Docente' : 'Registrar Nuevo Docente' }}
    </h3>
    
    <form (ngSubmit)="guardarDocente()" class="grid-form">
      
      <div class="form-group">
        <label class="form-label">DNI:</label>
        <input type="text" [(ngModel)]="nuevoDocente.dni" name="dni" required class="form-control">
      </div>
      
      <div class="form-group">
        <label class="form-label">Nombre:</label>
        <input type="text" [(ngModel)]="nuevoDocente.nombre" name="nombre" required class="form-control">
      </div>
      
      <div class="form-group">
        <label class="form-label">Teléfono:</label>
        <input type="text" [(ngModel)]="nuevoDocente.telefono" name="telefono" required class="form-control">
      </div>
      
      <div class="form-group">
        <label class="form-label">Correo:</label>
        <input type="email" [(ngModel)]="nuevoDocente.correo" name="correo" required class="form-control">
      </div>
      
      <div class="form-group">
        <label class="form-label">Universidad:</label>
        <input type="text" [(ngModel)]="nuevoDocente.universidad" name="universidad" required class="form-control">
      </div>
      
      <div class="form-group">
        <label class="form-label">Programa:</label>
        <input type="text" [(ngModel)]="nuevoDocente.programa" name="programa" required class="form-control">
      </div>

      <div class="form-actions">
        <button type="button" (click)="cerrarForm()" class="btn btn-secondary">Cancelar</button>
        <button type="submit" class="btn btn-primary">
          {{ editando ? 'Actualizar Datos' : 'Guardar Docente' }}
        </button>
      </div>
      
    </form>
  </div>

  <app-tabla-generica 
    titulo="Gestión de Docentes"
    textoBotonNuevo="+ Nuevo Docente"
    [columnas]="columnasDocentes" 
    [datos]="listaDocentes"
    (clicNuevo)="abrirForm()"
    (clicEditar)="cargarDatosParaEdicion($event)"
    (clicEliminar)="eliminarDocente($event)">
  </app-tabla-generica>

</div>
