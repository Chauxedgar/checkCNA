<div class="login-container">
  <div class="login-card">
    
    <h2 class="login-title">Autoevaluación checkCNA</h2>
    <p class="login-description">
      Ingrese sus credenciales para acceder al instrumento de evaluación.
    </p>

    <div *ngIf="mensajeError" class="login-error">
      {{ mensajeError }}
    </div>

    <form (ngSubmit)="ingresar()" class="login-form">
      <div class="form-group">
        <label class="form-label">Documento de Identidad:</label>
        <input type="text" [(ngModel)]="credenciales.documento" name="documento" required class="form-control">
      </div>

      <div class="form-group form-group-last">
        <label class="form-label">Contraseña:</label>
        <input type="password" [(ngModel)]="credenciales.contrasena" name="contrasena" required 
               placeholder="Ingrese nuevamente su documento" class="form-control">
      </div>

      <button type="submit" [disabled]="cargando" class="login-button">
        {{ cargando ? 'Verificando...' : 'Ingresar a la Encuesta' }}
      </button>
    </form>
    
  </div>
</div>
