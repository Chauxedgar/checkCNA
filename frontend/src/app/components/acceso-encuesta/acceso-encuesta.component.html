<div style="min-height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #f4f7f6; font-family: Arial, sans-serif;">
  
  <div style="background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center;">
    
    <h2 style="color: #0056b3; margin-bottom: 10px;">Autoevaluación checkCNA</h2>
    <p style="color: #666; font-size: 14px; margin-bottom: 30px;">
      Ingrese sus credenciales para acceder al instrumento de evaluación.
    </p>

    <div *ngIf="mensajeError" style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 20px; font-size: 14px;">
      {{ mensajeError }}
    </div>

    <form (ngSubmit)="ingresar()" style="text-align: left;">
      <div style="margin-bottom: 20px;">
        <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #333;">Documento de Identidad:</label>
        <input type="text" [(ngModel)]="credenciales.documento" name="documento" required 
               style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
      </div>

      <div style="margin-bottom: 30px;">
        <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #333;">Contraseña:</label>
        <input type="password" [(ngModel)]="credenciales.contrasena" name="contrasena" required 
               placeholder="Ingrese nuevamente su documento"
               style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
      </div>

      <button type="submit" [disabled]="cargando" 
              style="width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px;">
        {{ cargando ? 'Verificando...' : 'Ingresar a la Encuesta' }}
      </button>
    </form>
    
  </div>
</div>
