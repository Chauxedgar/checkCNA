<div class="card-container">
  
  <div class="table-header">
    <h2 class="table-title">{{ titulo }}</h2>
    <button (click)="onNuevo()" class="btn btn-success">
      {{ textoBotonNuevo }}
    </button>
  </div>

  <hr class="divider">

  <div class="table-responsive">
    <table class="custom-table">
      <thead>
        <tr>
          <th *ngFor="let col of columnas">
            {{ col.encabezado }}
          </th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of datos">
          
          <td *ngFor="let col of columnas">
            {{ item[col.llave] }}
          </td>
          
          <td class="action-cell">
            <button (click)="onEditar(item)" class="btn btn-warning btn-sm">Editar</button>
            <button (click)="onEliminar(item)" class="btn btn-danger btn-sm">Eliminar</button>
          </td>
          
        </tr>
        
        <tr *ngIf="datos.length === 0">
          <td [attr.colspan]="columnas.length + 1" class="empty-table">
            No hay registros disponibles.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  
</div>
