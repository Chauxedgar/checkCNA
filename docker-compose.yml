services:
  # 1. Contenedor de la Base de Datos (PostgreSQL)
  db:
    image: postgres:15
    container_name: base_datos_reacreditacion
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 2. Contenedor del Backend (Django)
  backend:
    build: ./backend
    container_name: backend_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  # 3. Contenedor del Frontend (Angular)
  frontend:
    build: ./frontend
    container_name: frontend_angular
    command: npm start
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"

volumes:
  postgres_data: